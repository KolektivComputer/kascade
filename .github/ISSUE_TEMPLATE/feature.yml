name: Feature / Goal
description: A new capability or product goal
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem this solves
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Optional
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: false
  - type: checkboxes
    id: targets
    attributes:
      label: Targets
      options:
        - label: repo
        - label: cli
        - label: docs
    validations:
      required: false
